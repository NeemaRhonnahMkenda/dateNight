<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ready for the Best Night?</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<style>
  body {
    height: 100vh; /* Ensure full viewport height */
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    margin: 0;
    padding: 0 10px 0 10px;
    background: linear-gradient(to right, #ff99c8, #ff66a3);
    font-family: 'Quicksand', sans-serif;
  }


  .question-container {
    text-align: center;
    background: #fff; /* White background for the question container */
    padding: 40px 60px;
    border-radius: 20px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
  }

  h1 {
    font-size: 2.5em;
    color: #ff4d6d;
    margin-bottom: 20px;
  }

  .button {
    background: linear-gradient(to right, #ff99c8, #ff66a3);
    border: none;
    padding: 15px 30px;
    color: white;
    font-size: 1.2em;
    border-radius: 30px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 10px rgba(255, 105, 180, 0.3);
  }

  .button:hover {
    background: linear-gradient(to right, #ff66a3, #ff3385);
    transform: scale(1.05);
    box-shadow: 0 6px 14px rgba(255, 105, 180, 0.4);
  }

</style>
<body>
<div class="question-container">
  <h1>Are you ready for the best night of your life? 🎉</h1>
  <button class="button" id="yesBtn">Yes! Let's go 💕</button>
</div>

<script>
  document.getElementById("yesBtn").addEventListener("click", () => {
    // Redirect to index.html after clicking 'Yes!'
    window.location.href = "intro.html";
  });
</script>
</body>
</html>
